services:
  mailpit:
    image: axllent/mailpit:latest
    container_name: labconnect-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8025"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-service:
    build:
      context: ./auth-service
    container_name: auth-service
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - SECRET_KEY=${SECRET_KEY}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - POCKETBASE_URL=${POCKETBASE_URL}
      - POCKETBASE_AUTH_IDENTITY=${POCKETBASE_AUTH_IDENTITY}
      - POCKETBASE_AUTH_PASSWORD=${POCKETBASE_AUTH_PASSWORD}
      - POCKETBASE_RETRY_SECONDS=${POCKETBASE_RETRY_SECONDS:-60}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2)"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 2s

  inventory-service:
    build:
      context: ./inventory-service
    container_name: inventory-service
    ports:
      - "8003:8003"
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8001
      - INVENTORY_SERVICE_URL=http://inventory-service:8003
      - SECRET_KEY=${SECRET_KEY}
      - POCKETBASE_URL=${POCKETBASE_URL}
      - POCKETBASE_AUTH_IDENTITY=${POCKETBASE_AUTH_IDENTITY}
      - POCKETBASE_AUTH_PASSWORD=${POCKETBASE_AUTH_PASSWORD}
      - POCKETBASE_RETRY_SECONDS=${POCKETBASE_RETRY_SECONDS:-60}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health', timeout=2)"]
      interval: 3s
      timeout: 2s
      retries: 10
      start_period: 2s

  role-service:
    build:
      context: ./role-service
    container_name: role-service
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8001
      - INVENTORY_SERVICE_URL=http://inventory-service:8003
      - SECRET_KEY=${SECRET_KEY}
      - POCKETBASE_URL=${POCKETBASE_URL}
      - POCKETBASE_AUTH_IDENTITY=${POCKETBASE_AUTH_IDENTITY}
      - POCKETBASE_AUTH_PASSWORD=${POCKETBASE_AUTH_PASSWORD}
      - POCKETBASE_RETRY_SECONDS=${POCKETBASE_RETRY_SECONDS:-60}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  reservation-service:
    build:
      context: ./reservation-service
    container_name: reservation-service
    ports:
      - "8005:8005"
    volumes:
      - ./reservation-service/data:/app/data
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8001
      - INVENTORY_SERVICE_URL=http://inventory-service:8003
      - SECRET_KEY=${SECRET_KEY}
      - POCKETBASE_URL=${POCKETBASE_URL}
      - POCKETBASE_AUTH_IDENTITY=${POCKETBASE_AUTH_IDENTITY}
      - POCKETBASE_AUTH_PASSWORD=${POCKETBASE_AUTH_PASSWORD}
      - POCKETBASE_USERS_COLLECTION=${POCKETBASE_USERS_COLLECTION:-users}
      - POCKETBASE_RETRY_SECONDS=${POCKETBASE_RETRY_SECONDS:-60}
      - TUTORIAL_SESSIONS_STORAGE_PATH=/app/data/tutorial_sessions.json
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - SMTP_SENDER=${SMTP_SENDER:-labconnect@ucb.edu.bo}
      - SMTP_USE_TLS=false
      - SMTP_USE_SSL=false
      - RESERVATION_REMINDER_CHECK_INTERVAL_SECONDS=${RESERVATION_REMINDER_CHECK_INTERVAL_SECONDS:-60}
    depends_on:
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8005/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  
  supply-reservation-service:
    build:
      context: ./supply-reservation-service
    container_name: supply-reservation-service
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "8006:8006"
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8001
      - SECRET_KEY=${SECRET_KEY}
      - POCKETBASE_URL=${POCKETBASE_URL}
      - POCKETBASE_AUTH_IDENTITY=${POCKETBASE_AUTH_IDENTITY}
      - POCKETBASE_AUTH_PASSWORD=${POCKETBASE_AUTH_PASSWORD}
      - POCKETBASE_TIMEOUT_SECONDS=${POCKETBASE_TIMEOUT_SECONDS:-10}
      - SUPPLY_RESERVATION_APP_PORT=8006
    depends_on:
      auth-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8006/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  ml-service:
    build:
      context: ./ml-service
    container_name: ml-service
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "8007:8007"
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8001
      - SECRET_KEY=${SECRET_KEY}
      - POCKETBASE_URL=${POCKETBASE_URL}
      - POCKETBASE_AUTH_IDENTITY=${POCKETBASE_AUTH_IDENTITY}
      - POCKETBASE_AUTH_PASSWORD=${POCKETBASE_AUTH_PASSWORD}
      - POCKETBASE_TIMEOUT_SECONDS=${POCKETBASE_TIMEOUT_SECONDS:-10}
      - ML_APP_PORT=8007
      - ML_CACHE_COLLECTION=${ML_CACHE_COLLECTION:-prediction_cache}
      - POCKETBASE_SUPPLY_DEMAND_VIEW=${POCKETBASE_SUPPLY_DEMAND_VIEW:-vista_supply_demand_60d}
      # Cron diario en la madrugada (hora local Bolivia UTC-4 por defecto).
      - ML_REFRESH_HOUR=${ML_REFRESH_HOUR:-3}
      - ML_REFRESH_MINUTE=${ML_REFRESH_MINUTE:-0}
      - ML_REFRESH_TZ_OFFSET_HOURS=${ML_REFRESH_TZ_OFFSET_HOURS:--4}
      - ML_PRECOMPUTE_SUPPLIES=${ML_PRECOMPUTE_SUPPLIES:-false}
      - ML_CACHE_MAX_AGE_SECONDS=${ML_CACHE_MAX_AGE_SECONDS:-90000}
    depends_on:
      auth-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8007/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api-gateway:
    build:
      context: ./api-gateway
    container_name: api-gateway
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - AUTH_SERVICE_URL=http://auth-service:8001
      - INVENTORY_SERVICE_URL=http://inventory-service:8003
      - ROLE_SERVICE_URL=http://role-service:8004
      - RESERVATIONS_SERVICE_URL=http://reservation-service:8005
      - SUPPLY_RESERVATION_SERVICE_URL=http://supply-reservation-service:8006
      - ML_SERVICE_URL=http://ml-service:8007
    ports:
      - "${API_GATEWAY_PORT:-8000}:8000"
    depends_on:
      auth-service:
        condition: service_started
      inventory-service:
        condition: service_started
      role-service:
        condition: service_started
      reservation-service:
        condition: service_started
      supply-reservation-service:
        condition: service_started
      ml-service:
        condition: service_started

networks:
  default:
    name: labconnect-backend-network

